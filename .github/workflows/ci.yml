name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      web: ${{ steps.classify.outputs.web }}
      native: ${{ steps.classify.outputs.native }}
      reason: ${{ steps.classify.outputs.reason }}
      sha: ${{ steps.classify.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: corepack enable
      - run: corepack npm@11.12.1 ci
      - name: Test scope classification and required-status policy
        run: node --test scripts/tests/ci-release-scope.test.mjs
      - name: Classify exact checked-out source
        id: classify
        run: node scripts/ci-release-scope.mjs classify
      - uses: actions/upload-artifact@v4
        with:
          name: tryoutflow-release-scope-${{ github.sha }}
          path: .next/release-audit/scope-classify.json
          if-no-files-found: error
          retention-days: 7

  web:
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    # The zero-retry browser matrix alone takes about 30 minutes on hosted runners;
    # retain time for database checks and mandatory cleanup without skipping stages.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: corepack enable
      - run: corepack npm@11.12.1 ci
      - name: Audit website and test-tool dependencies
        run: |
          node scripts/current-release-dependency-audit.mjs
          node --test scripts/tests/current-release-source-binding.test.mjs
      - name: Hosted-content native compatibility tests
        run: corepack npm@11.12.1 exec -- vitest run tests/unit/identity/native-workspace-bridge.test.tsx
      - run: corepack npm@11.12.1 exec -- supabase start
      - name: Use the signed primary Ubuntu archive for browser dependencies
        run: |
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          sources = [Path('/etc/apt/sources.list'), Path('/etc/apt/apt-mirrors.txt')]
          sources += list(Path('/etc/apt/sources.list.d').glob('*.sources'))
          sources += list(Path('/etc/apt/sources.list.d').glob('*.list'))
          for source in sources:
              if source.is_file():
                  original = source.read_text()
                  updated = original.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu').replace('https://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  if updated != original:
                      source.write_text(updated)
          Path('/etc/apt/apt.conf.d/80tryoutflow-ci-timeouts').write_text('Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "2";\n')
          PYTHON
      - run: corepack npm@11.12.1 exec -- playwright install --with-deps chromium firefox webkit
      - name: Website production readiness gate
        run: bash scripts/verify-production-readiness.sh
      - name: Retain synthetic browser and visual evidence on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: tryoutflow-visual-comparison-${{ github.sha }}
          retention-days: 1
          if-no-files-found: ignore
          path: |
            src/infrastructure/supabase/database.types.ts
            tests/e2e/visual/__snapshots__/**/family-*.png
            output/playwright/visual-results/**/*-actual.png
            output/playwright/visual-results/**/*-expected.png
            output/playwright/visual-results/**/*-diff.png
            output/playwright/visual-results/**/trace.zip
            output/playwright/visual-results/**/test-failed-*.png
            output/playwright/visual-results/**/error-context.md
            output/playwright/test-results/**/trace.zip
            output/playwright/test-results/**/test-failed-*.png

  native:
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - run: corepack enable
      - run: corepack npm@11.12.1 ci
      - run: corepack npm@11.12.1 ci --prefix apps/mobile
      - name: Audit native and shared test-tool dependencies without a new exception
        run: |
          node scripts/current-release-dependency-audit.mjs
          node --test scripts/tests/current-release-source-binding.test.mjs
          node --test scripts/tests/current-release-native-audit.test.mjs
          node --test scripts/tests/current-release-native-clean-audit.test.mjs
          node --test scripts/tests/native-deepmerge-backport.test.mjs
          node scripts/current-release-native-audit.mjs
      - name: Native typecheck
        run: corepack npm@11.12.1 run --prefix apps/mobile typecheck
      - name: Native behavioral tests
        run: corepack npm@11.12.1 exec -- vitest run --config apps/mobile/vitest.config.mts
      - name: Compile iOS and Android JavaScript bundles without signing or publication
        working-directory: apps/mobile
        env:
          CI: '1'
          EXPO_PUBLIC_API_URL: https://release.tryoutflow.test
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:58321
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-ci-placeholder
        run: |
          mkdir -p ../../output/native-ci/ios ../../output/native-ci/android
          corepack npm@11.12.1 run bundle:ios
          corepack npm@11.12.1 run bundle:android

  # Preserve the existing required status name. A skipped dependency is not a pass
  # unless the successful, exact-SHA classifier explicitly excluded that scope.
  verify:
    if: ${{ always() }}
    needs: [scope, web, native]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Require every selected scope to succeed
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-release-scope.mjs verify
      - uses: actions/upload-artifact@v4
        with:
          name: tryoutflow-required-gate-${{ github.sha }}
          path: .next/release-audit/scope-verify.json
          if-no-files-found: error
          retention-days: 7
