name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Measured setup plus the complete zero-retry five-browser gate and final cleanup.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: corepack enable
      - run: corepack npm@11.12.1 ci
      - name: Audit web and native dependencies
        run: |
          node scripts/current-release-dependency-audit.mjs
          node --test scripts/tests/current-release-source-binding.test.mjs
          node --test scripts/tests/current-release-native-audit.test.mjs
          node scripts/current-release-native-audit.mjs
      - run: corepack npm@11.12.1 exec -- playwright install --with-deps chromium firefox webkit
      - run: corepack npm@11.12.1 exec -- supabase start
      - name: Production readiness gate
        run: bash scripts/verify-production-readiness.sh
      - name: Retain synthetic browser and visual evidence on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: tryoutflow-visual-comparison-${{ github.sha }}
          retention-days: 1
          if-no-files-found: ignore
          path: |
            output/playwright/visual-results/**/*-actual.png
            output/playwright/visual-results/**/*-expected.png
            output/playwright/visual-results/**/*-diff.png
            output/playwright/test-results/**/trace.zip
            output/playwright/test-results/**/error-context.md
            output/playwright/test-results/**/test-failed-*.png

  password-visual-review:
    name: Review four password auth visuals (no release approval)
    needs: verify
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/codex/tryoutflow-offline-preconditions-oct7' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      COREPACK_HOME: ${{ runner.temp }}/tryoutflow-password-review-corepack
      REVIEW_BASE_ROOT: ${{ github.workspace }}/app-base
      REVIEW_OUTPUT_ROOT: ${{ runner.temp }}/tryoutflow-password-visual-review
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 8c107546f6f2ab40e5c93c64b85457839e4dfb1a
          path: app-base
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: control/.nvmrc
          cache: npm
          cache-dependency-path: app-base/package-lock.json
      - run: corepack enable
      - name: Install unchanged pinned dependencies in the disposable runner
        working-directory: app-base
        run: corepack npm@11.12.1 ci
      - name: Capture exact base and password projection with original comparisons
        run: node control/scripts/review/password-visibility/prepare-and-run.mjs
      - name: Retain anonymous visual review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tryoutflow-password-visual-review-${{ github.sha }}
          retention-days: 1
          if-no-files-found: error
          path: ${{ runner.temp }}/tryoutflow-password-visual-review/artifacts/
